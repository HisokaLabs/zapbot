name: Feature request
description: Suggest a new feature, plugin, or improvement
title: "feat: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion.

        > ⚠️ **Read first:** this project is a **base script** built on top of
        > [`zapo-js`](https://github.com/vinikjkkj/zapo). New features should
        > almost always be a **plugin** (`src/plugins/<category>/<name>.js`) or
        > an **event module** (`src/events/*.js`). Requests that require
        > changing `src/core/*` fundamentals are generally rejected.
  - type: textarea
    id: motivation
    attributes:
      label: What problem does this solve?
      description: Describe the use case and why existing plugins don't cover it.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How should it work? Command name, event, behavior, config options.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you tried or thought about.
  - type: dropdown
    id: scope
    attributes:
      label: Where would this live?
      description: Preferred implementation layer.
      options:
        - New plugin (preferred — no core changes)
        - New event module
        - Utility function in src/utils
        - Core change (src/core/*) — needs strong justification
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and this is not a duplicate
          required: true
        - label: I understand new features should be a plugin/event and avoid core changes
          required: true
